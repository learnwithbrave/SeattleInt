name: SeattleInt CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - docs/architecture-and-migration-plan
      - feat/cms-phase-0-1-foundation

permissions:
  contents: read

concurrency:
  group: seattleint-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend baseline (lint and build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and production build
        run: npm run build

  database:
    name: Supabase migration and database tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Start disposable local Supabase
        run: supabase start

      - name: Recreate local database from committed migrations and seed
        run: supabase db reset --local --yes

      - name: Lint local database schema
        run: supabase db lint --local

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop
